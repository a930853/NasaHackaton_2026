# Despliegue principal: Internet con Coolify (VPS). Guía: docs/es/deploy.md
#
# Coolify pone delante su proxy (Traefik) con un certificado de Let's Encrypt y
# reenvía https://<dominio> al puerto 80 del servicio "web". Por eso aquí no se
# publican puertos (el 80 y el 443 del VPS son de Traefik).
#
# En Coolify: recurso "Docker Compose" con este fichero (/compose.yaml) y el
# dominio puesto solo en el servicio "web".
#
# En local (HTTPS con certificado autofirmado en el 80/443 del PC):
#   npm run docker:local   el juego
#   npm run docker:dev     la pantalla de depuración, con log de mensajes

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LOG_MESSAGES: "0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        GAME_EXPORT: game
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
