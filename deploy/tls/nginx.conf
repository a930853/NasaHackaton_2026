# Proxy HTTPS para desplegar en local (compose.local.yaml).
#
# Hace lo mismo que Traefik en Coolify: cifra con un certificado (aquí autofirmado,
# lo genera 15-cert.sh) y reenvía todo, WebSocket incluido, al servicio "web".

# HTTP: solo redirige a HTTPS (por si alguien escribe la IP sin https://).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

# Upgrade solo cuando el navegador lo pide (WebSocket en /ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        # Una partida dura más que el minuto por defecto; el backend hace ping cada 15 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
