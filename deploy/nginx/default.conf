# Nginx: proxy inverso que cifra todo con HTTPS.
#
# Godot 4 solo arranca en web en un "contexto seguro" (HTTPS o localhost), así
# que todo se sirve por HTTPS. El backend no cambia: Nginx descifra y le habla
# por HTTP dentro de la red de Docker.
#
# Todo sale del mismo origen, así los clientes construyen la URL del WebSocket
# con location (wss://<host>/ws) y no hay IPs fijas en el código.

# HTTP: solo redirige a HTTPS (por si alguien escribe la IP sin https://).
# Supone que HTTPS está en el 443; con otro puerto, entrad con https:// directamente.
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/cert.pem;   # los genera 15-cert.sh
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /srv/www;
    index index.html;

    # Redirecciones relativas (p. ej. /game → /game/) para que funcionen aunque
    # el puerto publicado no sea el estándar.
    absolute_redirect off;

    # La exportación de Godot pesa: comprimir el .wasm y el JavaScript.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    # Página de inicio
    location = / {
        add_header Cache-Control "no-cache";
    }

    # Pantalla principal (Godot). Sin caché: cada exportación reemplaza los
    # mismos nombres de fichero (index.pck, index.wasm…).
    location /game/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Mando (Vue). Las rutas de rol (/controller/engineer…) no existen como
    # fichero: se sirve index.html y el router del mando decide.
    location /controller/ {
        try_files $uri $uri/ /controller/index.html;
    }

    # WebSocket único para Godot y mandos
    location = /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Una partida dura más que el minuto por defecto; el backend hace ping cada 15 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
