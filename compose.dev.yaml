# Desarrollo en local: como compose.local.yaml, pero sirve la pantalla de
# depuración (dist/game_debug) y muestra los mensajes en bruto.
#
#   npm run docker:dev   →  docker compose -f compose.yaml -f compose.local.yaml -f compose.dev.yaml up --build

services:
  backend:
    environment:
      LOG_MESSAGES: "1" # mensajes en bruto en `docker compose logs -f backend`

  web:
    build:
      args:
        GAME_EXPORT: game_debug # pantalla de depuración en lugar del juego
