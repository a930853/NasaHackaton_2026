<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
			Plantilla web propia de Godot con pantalla de carga: un cohete sale de la Tierra, pasa por la Luna y
			llega a Marte según avanza la descarga. Sustituye a la pantalla de carga de Godot.
			NO se edita game/web/loading_shell.html (se genera): se edita ESTE fichero y se ejecuta
			`python tools/build_loading_shell.py`, que le mete las imágenes (Tierra, Luna, Marte y cohete) y la fuente.
			Los marcadores @@...@@ los sustituye ese script; los $GODOT_... los sustituye Godot al exportar.
			Para probar la animación sin esperar a la descarga: abrir la página con ?fakeload=8 (segundos).
		-->
		<style>
@font-face {
	font-family: 'MissionFont';
	src: url(@@FONT@@) format('woff2');
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---------- Pantalla de carga ---------- */

#status {
	position: fixed;
	inset: 0;
	z-index: 10;
	overflow: hidden;
	background: radial-gradient(ellipse at 50% 35%, #1b2a55 0%, #0b1330 55%, #050816 100%);
	font-family: 'MissionFont', 'Courier New', monospace;
	transition: opacity 0.6s ease;
}

#status.leaving {
	opacity: 0;
	pointer-events: none;
}

.star {
	position: absolute;
	background: #fff;
	animation: twinkle 2.4s ease-in-out infinite;
}

@keyframes twinkle {
	0%, 100% { opacity: 0.25; }
	50% { opacity: 1; }
}

#route {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
}

#route path {
	fill: none;
	stroke: rgba(160, 200, 255, 0.35);
	stroke-width: 3;
	stroke-dasharray: 2 14;
	stroke-linecap: square;
}

.planet {
	position: absolute;
	image-rendering: pixelated;
	transform: translate(-50%, -50%);
	filter: drop-shadow(0 0 14px rgba(150, 200, 255, 0.25));
}

#mars.arrived {
	animation: arrive 1.1s ease-out;
}

@keyframes arrive {
	0% { filter: drop-shadow(0 0 0 rgba(255, 150, 60, 0)); transform: translate(-50%, -50%) scale(1); }
	35% { filter: drop-shadow(0 0 40px rgba(255, 170, 70, 0.95)); transform: translate(-50%, -50%) scale(1.12); }
	100% { filter: drop-shadow(0 0 18px rgba(255, 150, 60, 0.55)); transform: translate(-50%, -50%) scale(1); }
}

.planet-label {
	position: absolute;
	transform: translate(-50%, 0);
	font-size: 13px;
	letter-spacing: 0.12em;
	color: rgba(190, 215, 255, 0.7);
	text-transform: uppercase;
	white-space: nowrap;
}

#rocket {
	position: absolute;
	left: 0;
	top: 0;
	width: 24px;
	height: 40px;
	margin: -20px 0 0 -12px;
	transform-origin: 12px 20px;
	will-change: transform;
}

#rocket-sprite {
	width: 24px;
	height: 40px;
	background-image: url(@@ROCKET@@);
	background-size: 48px 40px;
	background-repeat: no-repeat;
	image-rendering: pixelated;
	animation: flame 0.24s steps(1) infinite;
}

@keyframes flame {
	0% { background-position: 0 0; }
	50% { background-position: -24px 0; }
}

.trail {
	position: absolute;
	width: 6px;
	height: 6px;
	margin: -3px 0 0 -3px;
	background: #ffcf5a;
	opacity: 0.9;
	animation: trail-fade 0.8s linear forwards;
}

@keyframes trail-fade {
	0% { opacity: 0.9; transform: scale(1); background: #ffcf5a; }
	40% { background: #ff7a2a; }
	100% { opacity: 0; transform: scale(0.3); background: #6a2a20; }
}

#title {
	position: absolute;
	top: 7%;
	left: 0;
	right: 0;
	text-align: center;
	font-size: clamp(22px, 5vw, 54px);
	letter-spacing: 0.08em;
	color: #ffe9b0;
	text-shadow: 0 3px 0 #000, 0 0 24px rgba(255, 190, 90, 0.35);
}

#bottom {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 8%;
	text-align: center;
}

#phase {
	font-size: clamp(14px, 2.2vw, 22px);
	letter-spacing: 0.1em;
	color: #cfe3ff;
	text-shadow: 0 2px 0 #000;
}

#percent {
	margin-top: 10px;
	font-size: clamp(12px, 1.6vw, 16px);
	letter-spacing: 0.2em;
	color: #7fa6e6;
}

#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	max-width: min(90vw, 640px);
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 2;
}

#status.failed #scene,
#status.failed #title,
#status.failed #bottom {
	display: none;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="stars"></div>
			<div id="scene">
				<svg id="route" xmlns="http://www.w3.org/2000/svg"><path id="route-path" d=""></path></svg>
				<img id="earth" class="planet" src="@@EARTH@@" alt="Earth">
				<img id="moon" class="planet" src="@@MOON@@" alt="Moon">
				<img id="mars" class="planet" src="@@MARS@@" alt="Mars">
				<div id="label-earth" class="planet-label">Earth</div>
				<div id="label-moon" class="planet-label">Moon</div>
				<div id="label-mars" class="planet-label">Mars</div>
				<div id="rocket"><div id="rocket-sprite"></div></div>
			</div>
			<div id="title">MARS MISSION</div>
			<div id="bottom">
				<div id="phase">Launching from Earth</div>
				<div id="percent">0%</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

	// ------------------------------------------------------------------ Pantalla de carga: cohete
	const MAX_SPEED = 0.34;         // trayecto completo por segundo como máximo (mínimo ~3 s de viaje)
	const DOWNLOAD_SHARE = 0.9;     // la descarga llena hasta el 90 %; el 10 % final es arrancar el juego
	const LANDING_SECONDS = 0.8;
	const FINISH_PAUSE_MS = 700;
	const TRAIL_EVERY_MS = 45;
	const FAKE_SECONDS = parseFloat(new URLSearchParams(location.search).get('fakeload')) || 0;

	const $ = (id) => document.getElementById(id);
	const earth = $('earth'), moon = $('moon'), mars = $('mars');
	const rocket = $('rocket'), phaseText = $('phase'), percentText = $('percent'), scene = $('scene');

	let W = 0, H = 0, scale = 1, path = null;
	let shown = 0;                  // lo que se ve (0 a 1): el cohete persigue al progreso real
	let downloadProgress = 0;       // 0 a 1, de la descarga real
	let indeterminate = false;
	let started = false;            // el juego ya está en marcha
	let landing = -1;               // -1: aún no; 0 a 1: aterrizando
	let finished = false;
	let lastFrame = performance.now();
	let lastTrail = 0;
	const t0 = performance.now();

	function buildStars() {
		const holder = $('stars');
		holder.textContent = '';
		for (let i = 0; i < 90; i++) {
			const star = document.createElement('div');
			const size = Math.random() < 0.15 ? 3 : 2;
			star.className = 'star';
			star.style.cssText = 'left:' + (Math.random() * 100).toFixed(2) + '%;top:' + (Math.random() * 100).toFixed(2) +
				'%;width:' + size + 'px;height:' + size + 'px;animation-delay:' + (Math.random() * 2.4).toFixed(2) + 's';
			holder.appendChild(star);
		}
	}

	function placePlanet(img, label, cx, cy, blocks) {
		const size = 32 * blocks;
		img.style.width = size + 'px';
		img.style.height = size + 'px';
		img.style.left = cx + 'px';
		img.style.top = cy + 'px';
		label.style.left = cx + 'px';
		label.style.top = (cy + size / 2 + 8) + 'px';
		return size / 2;
	}

	function layout() {
		W = window.innerWidth;
		H = window.innerHeight;
		const block = Math.max(2, Math.min(6, Math.round(W / 240)));
		scale = Math.max(2, Math.min(4, Math.round(Math.min(W, H * 1.5) / 420)));
		const ex = W * 0.14, ey = H * 0.66;
		const mx = W * 0.5, my = H * 0.4;
		const rx = W * 0.86, ry = H * 0.66;
		const er = placePlanet(earth, $('label-earth'), ex, ey, block);
		const mr = placePlanet(moon, $('label-moon'), mx, my, Math.max(2, block - 2));
		const rr = placePlanet(mars, $('label-mars'), rx, ry, Math.max(2, block - 1));

		// Salida: sobre el borde de la Tierra. Paso: justo encima de la Luna. Llegada: sobre el borde de Marte.
		const start = { x: ex + er * 0.7, y: ey - er * 0.7 };
		const pass = { x: mx + mr * 0.15, y: my - mr - 18 * scale };
		const end = { x: rx - rr * 0.7, y: ry - rr * 0.7 };
		// Puntos de control a la altura del paso: la trayectoria sube en arco, pasa por la Luna en horizontal
		// y baja hacia Marte, sin picos.
		const c1 = { x: pass.x - (pass.x - start.x) * 0.5, y: pass.y };
		const c2 = { x: pass.x + (end.x - pass.x) * 0.5, y: pass.y };
		path = { start, pass, end, c1, c2, mars: { x: rx, y: ry }, marsRadius: rr };

		$('route-path').setAttribute('d', 'M' + start.x + ' ' + start.y + ' Q' + c1.x + ' ' + c1.y + ' ' + pass.x + ' ' + pass.y +
			' Q' + c2.x + ' ' + c2.y + ' ' + end.x + ' ' + end.y);
	}

	function bezier(p0, c, p1, u) {
		const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
		return {
			x: a * p0.x + b * c.x + d * p1.x,
			y: a * p0.y + b * c.y + d * p1.y,
			dx: 2 * (1 - u) * (c.x - p0.x) + 2 * u * (p1.x - c.x),
			dy: 2 * (1 - u) * (c.y - p0.y) + 2 * u * (p1.y - c.y),
		};
	}

	function pointAt(t) {
		if (t <= 0.5) {
			return bezier(path.start, path.c1, path.pass, t * 2);
		}
		return bezier(path.pass, path.c2, path.end, (t - 0.5) * 2);
	}

	function phaseFor(t) {
		if (landing >= 0) return 'Welcome to Mars!';
		if (t < 0.3) return 'Launching from Earth';
		if (t < 0.58) return 'Passing the Moon';
		return 'Flying to Mars';
	}

	function spawnTrail(x, y, angle, now) {
		if (now - lastTrail < TRAIL_EVERY_MS) return;
		lastTrail = now;
		const back = 20 * scale;      // un poco detrás de la tobera
		const dot = document.createElement('div');
		dot.className = 'trail';
		dot.style.left = (x - Math.cos(angle) * back + (Math.random() - 0.5) * 6) + 'px';
		dot.style.top = (y - Math.sin(angle) * back + (Math.random() - 0.5) * 6) + 'px';
		scene.appendChild(dot);
		setTimeout(() => dot.remove(), 850);
	}

	function frame(now) {
		if (finished) return;
		const dt = Math.min((now - lastFrame) / 1000, 0.1);
		lastFrame = now;

		// Objetivo: lo que lleva descargado (o un avance lento si no se sabe el total)
		let progress = downloadProgress;
		if (FAKE_SECONDS > 0) {
			progress = Math.min(1, (now - t0) / 1000 / FAKE_SECONDS);
		} else if (indeterminate) {
			progress = Math.min(0.9, (now - t0) / 1000 * 0.05);
		}
		const canFinish = started && (FAKE_SECONDS <= 0 || (now - t0) / 1000 >= FAKE_SECONDS);
		const target = canFinish ? 1 : progress * DOWNLOAD_SHARE;

		if (shown < target) {
			const speed = Math.min(MAX_SPEED, Math.max((target - shown) * 3, 0.05));
			shown = Math.min(target, shown + speed * dt);
		}

		let x, y, angle, rocketScale = scale, opacity = 1;
		const p = pointAt(Math.min(shown, 1));
		x = p.x; y = p.y;
		angle = Math.atan2(p.dy, p.dx);

		if (shown >= 0.999 && landing < 0) {
			landing = 0;
			mars.classList.add('arrived');
		}
		if (landing >= 0) {
			landing = Math.min(1, landing + dt / LANDING_SECONDS);
			const ease = landing * landing * (3 - 2 * landing);
			x = path.end.x + (path.mars.x - path.end.x) * ease;
			y = path.end.y + (path.mars.y - path.end.y) * ease;
			rocketScale = scale * (1 - 0.75 * ease);
			opacity = 1 - ease;
			if (landing >= 1 && !finished) {
				finished = true;
				percentText.textContent = '100%';
				setTimeout(leave, FINISH_PAUSE_MS);
			}
		} else {
			spawnTrail(x, y, angle, now);
		}

		rocket.style.opacity = opacity;
		rocket.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (angle + Math.PI / 2) + 'rad) scale(' + rocketScale + ')';
		phaseText.textContent = phaseFor(shown);
		percentText.textContent = Math.floor(Math.min(shown, 1) * 100) + '%';
		requestAnimationFrame(frame);
	}

	function leave() {
		statusOverlay.classList.add('leaving');
		setTimeout(() => statusOverlay.remove(), 700);
	}

	buildStars();
	layout();
	window.addEventListener('resize', layout);
	requestAnimationFrame(frame);

	// ------------------------------------------------------------------ Avisos de error (como la plantilla de Godot)
	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		finished = true;
		statusOverlay.classList.add('failed');
		statusNotice.style.display = 'block';
	}

	// ------------------------------------------------------------------ Arranque del juego
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					indeterminate = false;
					downloadProgress = Math.min(1, current / total);
				} else {
					indeterminate = true;
				}
			},
		}).then(() => {
			started = true;
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
