<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2030">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <title>Mars Mission</title>
  <style>
    /*
     * Página de inicio: crear partida (pantalla grande) o entrar con código (móvil).
     * Mismo aparato que el mando (controller/src/styles.css): carcasa de la cabina del juego sobre
     * la foto de Marte del menú, placa con el casco, pantallas con bisel y teclas que se hunden.
     * Fuentes e imágenes locales en assets/ (copiadas de @fontsource y de game/Images): sin Internet.
     */
    @font-face { font-family: 'Sixtyfour'; font-weight: 400; font-display: swap; src: url('assets/sixtyfour.woff2') format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 500; font-display: swap; src: url('assets/chakra-petch-500.woff2') format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-display: swap; src: url('assets/chakra-petch-700.woff2') format('woff2'); }

    :root {
      color-scheme: dark;
      --hull: #8b93a8; --hull-light: #b3bacb; --ink: #1a2030;
      --screen: #0d1424; --screen-2: #172238; --glass: #dfe8ff; --glass-dim: #9fb0cc;
      --key-orange: #ffa826; --key-cyan: #4db8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
      padding: 20px 0; background-color: var(--ink);
      background-image: linear-gradient(rgb(13 20 36 / .35), rgb(13 20 36 / .6)), url('assets/mars.jpg');
      background-size: cover; background-position: center top; background-attachment: fixed;
      font: 500 17px/1.45 'Chakra Petch', system-ui, sans-serif; color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 3px solid var(--key-cyan); outline-offset: 3px; }

    /* El aparato, con el sombreado de dibujos del marco del juego */
    .device {
      position: relative; width: calc(100% - 20px); max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px; padding: 32px 14px;
      border: 4px solid var(--ink); border-radius: 28px; background-color: var(--hull);
      background-image:
        radial-gradient(120% 60% at 15% 0%, rgb(255 255 255 / .22), transparent 60%),
        linear-gradient(180deg, transparent 55%, rgb(26 32 48 / .22) 100%);
      box-shadow:
        inset 0 4px 0 rgb(255 255 255 / .35), inset 0 -6px 0 rgb(26 32 48 / .3),
        inset 0 0 0 2px rgb(26 32 48 / .08), 0 18px 40px rgb(0 0 0 / .45);
    }
    .screw { position: absolute; width: 14px; height: 15px; background: url('assets/screw.png') center / contain no-repeat; }
    .screw.tl { top: 10px; left: 12px; } .screw.tr { top: 10px; right: 12px; }
    .screw.bl { bottom: 10px; left: 12px; } .screw.br { bottom: 10px; right: 12px; }

    .plate {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border: 3px solid var(--ink); border-radius: 18px; background: var(--hull-light);
      box-shadow: inset 0 3px 0 rgb(255 255 255 / .4), inset 0 -3px 0 rgb(26 32 48 / .15);
    }
    /* Casco del juego (blanco): aquí aún no hay rol */
    .helmet { width: 48px; height: 48px; flex: none; background: url('assets/helmet.png') center / contain no-repeat; }
    h1 { margin: 0; font: 400 clamp(16px, 4.6vw, 21px)/1.25 'Sixtyfour', monospace; letter-spacing: -.02em; }
    .plate p { margin: 2px 0 0; font-size: 15px; color: rgb(26 32 48 / .78); }

    .screen {
      padding: 24px; border: 3px solid var(--ink); border-radius: 22px; background: var(--screen); color: var(--glass);
      box-shadow: inset 0 0 0 5px var(--hull-light), inset 0 0 0 8px var(--ink), inset 0 0 30px rgb(77 184 255 / .14);
    }
    h2 { margin: 0; font-size: clamp(21px, 6vw, 25px); line-height: 1.2; font-weight: 700; }
    .screen p { margin: 6px 0 0; color: var(--glass-dim); }
    label { display: block; margin-top: 16px; font-weight: 700; }

    .field {
      display: block; width: 100%; margin-top: 6px; padding: 12px 16px;
      border: 3px solid var(--ink); border-radius: 14px; background: var(--screen-2); color: var(--glass);
      box-shadow: inset 0 3px 0 rgb(0 0 0 / .35);
      font: 400 20px/1.3 'Sixtyfour', monospace; letter-spacing: .18em; text-transform: uppercase;
    }
    .field::placeholder { color: rgb(159 176 204 / .45); }
    .field:focus { border-color: var(--key-orange); outline: none; }

    /* Tecla del aparato: color sólido, contorno y sombra dura que desaparece al pulsar */
    .key {
      display: block; width: 100%; padding: 14px 16px; cursor: pointer; text-align: center; text-decoration: none;
      border: 3px solid var(--ink); border-radius: 16px; background: var(--key, var(--key-orange)); color: var(--ink);
      font: 700 18px/1.3 'Chakra Petch', system-ui, sans-serif;
      box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgb(255 255 255 / .35);
      transition: transform 80ms ease-out, box-shadow 80ms ease-out, filter 120ms;
    }
    .key:hover { filter: brightness(1.06); }
    .key:active { transform: translateY(6px); box-shadow: 0 0 0 var(--ink), inset 0 3px 0 rgb(255 255 255 / .35); }
    .key-cyan { --key: var(--key-cyan); }

    .part { display: flex; flex-direction: column; gap: 16px; }
    .tip { margin: 0; padding: 0 4px; font-size: 15px; }

    @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
  </style>
</head>
<body>
  <main class="device">
    <span class="screw tl" aria-hidden="true"></span>
    <span class="screw tr" aria-hidden="true"></span>

    <header class="plate">
      <span class="helmet" aria-hidden="true"></span>
      <div>
        <h1>Mars Mission</h1>
        <p>A team game for up to 4 astronauts</p>
      </div>
    </header>

    <section class="part" aria-labelledby="host-title">
      <div class="screen">
        <h2 id="host-title">On the big screen</h2>
        <p>Open the game on the computer that everyone can see. It shows a room code and a QR code.</p>
      </div>
      <a class="key" href="/game/">Create a game</a>
    </section>

    <form class="part" action="/controller/" method="get" aria-labelledby="join-title">
      <div class="screen">
        <h2 id="join-title">On your phone</h2>
        <p>Scan the QR code, or type the room code you see on the big screen.</p>
        <label for="room">Room code</label>
        <input class="field" id="room" name="room" maxlength="8" placeholder="K7MP"
               autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      </div>
      <button class="key key-cyan" type="submit">Join the room</button>
    </form>

    <p class="tip">Every phone opens this same web address.</p>

    <span class="screw bl" aria-hidden="true"></span>
    <span class="screw br" aria-hidden="true"></span>
  </main>

  <script>
    // El código viaja en mayúsculas y sin espacios (el mando lo normaliza igual).
    const room = document.getElementById('room')
    room.addEventListener('input', () => { room.value = room.value.toUpperCase().replace(/\s+/g, '') })
  </script>
</body>
</html>
